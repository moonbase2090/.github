name: Bug report
description: Report something that is not working as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report security vulnerabilities here. See SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: e.g. macOS 15 arm64, Ubuntu 24.04 x86_64
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Remove any secrets or personal data first.
      render: text
